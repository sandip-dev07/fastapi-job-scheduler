name: job-scheduler

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobqueue}:${POSTGRES_PASSWORD:-jobqueue}@postgres:5432/${POSTGRES_DB:-jobqueue}
  REDIS_URL: redis://redis:6379/0
  APP_NAME: ${APP_NAME:-Job Scheduler API}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEFAULT_MAX_RETRIES: ${DEFAULT_MAX_RETRIES:-3}
  DEFAULT_RETRY_BACKOFF_SECONDS: ${DEFAULT_RETRY_BACKOFF_SECONDS:-5}
  MAX_RETRY_BACKOFF_SECONDS: ${MAX_RETRY_BACKOFF_SECONDS:-300}
  RUN_MIGRATIONS: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
      POSTGRES_USER: ${POSTGRES_USER:-jobqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-jobqueue} -d ${POSTGRES_DB:-jobqueue}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    image: job-scheduler:local
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
    image: job-scheduler:local
    environment:
      <<: *app-environment
    command:
      - celery
      - -A
      - src.utils.celery:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A src.utils.celery:celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
